version: 2

models:
  - name: dim_customers
    description: "Dimensão unificada de clientes B2C e B2B."
    columns:
      - name: customer_id
        description: "Chave primária do cliente."
        tests:
          - unique
          - not_null
      - name: customer_type
        description: "Classificação da carteira de clientes."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["Store (B2B)", "Individual (B2C)"]

  - name: dim_sales_reps
    description: "Dimensão da equipe comercial e representantes de vendas."
    columns:
      - name: sales_person_id
        description: "Chave primária do vendedor."
        tests:
          - unique
          - not_null

  - name: fct_sales
    description: "Tabela fato de vendas no grão do item faturado."
    columns:
      - name: sales_order_detail_id
        description: "Chave primária do item do pedido."
        tests:
          - unique
          - not_null
      - name: product_id
        description: "Chave estrangeira do produto vendido."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_id
      - name: customer_id
        description: "Chave estrangeira do cliente."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: order_date_key
        description: "Chave estrangeira de data do pedido."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_dates')
                field: date_key
      - name: sales_channel
        description: "Canal de venda praticado."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["Digital (E-commerce)", "Físico / Revenda"]
      - name: net_amount
        description: "Receita líquida da venda."
        tests:
          - not_null
